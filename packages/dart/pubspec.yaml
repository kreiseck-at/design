name: kreiseck_design
description: Design tokens, theme and widgets shared by all Kreiseck surfaces.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Archivo
      fonts:
        - { asset: fonts/Archivo-400.ttf, weight: 400 }
        - { asset: fonts/Archivo-500.ttf, weight: 500 }
        - { asset: fonts/Archivo-600.ttf, weight: 600 }
        - { asset: fonts/Archivo-700.ttf, weight: 700 }
    - family: DM Mono
      fonts:
        - { asset: fonts/DMMono-400.ttf, weight: 400 }
        - { asset: fonts/DMMono-500.ttf, weight: 500 }
  assets:
    - assets/signet.svg
    - assets/signet-invers.svg
