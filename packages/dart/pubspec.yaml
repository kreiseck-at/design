name: kreiseck_design
description: Design tokens, Material theme and brand assets shared by all Kreiseck surfaces — colour ramps in OKLCH, roles for four modes, Archivo and DM Mono.
version: 0.1.0
homepage: https://github.com/kreiseck-at/design
repository: https://github.com/kreiseck-at/design
issue_tracker: https://github.com/kreiseck-at/design/issues

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Archivo
      fonts:
        - { asset: fonts/Archivo-400.ttf, weight: 400 }
        - { asset: fonts/Archivo-500.ttf, weight: 500 }
        - { asset: fonts/Archivo-600.ttf, weight: 600 }
        - { asset: fonts/Archivo-700.ttf, weight: 700 }
    - family: DM Mono
      fonts:
        - { asset: fonts/DMMono-400.ttf, weight: 400 }
        - { asset: fonts/DMMono-500.ttf, weight: 500 }
